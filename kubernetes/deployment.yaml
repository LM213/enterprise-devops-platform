apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: dev

spec:
  replicas: 2
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-app
          image: nginx:latest

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: web-app-config
            - secretRef:
                name: web-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20