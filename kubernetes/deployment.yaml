apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: dev
  annotations:
    app-version: "1.0.2"

spec:
  replicas: 2
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-app
          image: 111046292730.dkr.ecr.us-east-1.amazonaws.com/enterprise-devops-app:1.0.2

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: web-app-config
            - secretRef:
                name: web-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20